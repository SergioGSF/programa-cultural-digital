name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configurar o Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17' 
        distribution: 'temurin'
        cache: maven

    - name: Build Maven realizado com sucesso
      run: mvn -B package --file pom.xml

    - name: Testes executados
      run: mvn test

    - name: Configurar Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Geração da imagem Docker concluída
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: sergiogsf/programa-cultural-digital:latest
